# v* 태그 푸시 → 테스트 → portable exe 빌드 → GitHub Release 생성 + exe 업로드.
# 프로그램 자동 업데이트(electron/app-update.js)가 이 릴리스의 ER-Damage-Calculator-*-portable.exe 를 받는다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build:exe

      - name: Create release with the exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="dist/ER-Damage-Calculator-${GITHUB_REF_NAME#v}-portable.exe"
          test -f "$exe"
          # 1.1.0 의 자동 업데이트는 옛 이름(ER-Damage-Calculator-v2-*-portable.exe)만 찾으므로 같은 파일을 그 이름으로도 올린다.
          legacy="dist/ER-Damage-Calculator-v2-${GITHUB_REF_NAME#v}-portable.exe"
          cp "$exe" "$legacy"
          gh release create "$GITHUB_REF_NAME" "$exe" "$legacy" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
