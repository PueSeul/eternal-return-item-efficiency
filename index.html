<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이터널 리턴 아이템별 가격대비 효율 계산기</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- 데스크톱 exe 전용 타이틀바(electron/preload.js 가 보이게 하고 아이콘·제목·버전을 넣음). 웹에서는 숨김. -->
  <div id="titlebar" class="titlebar" hidden>
    <img class="titlebar-icon" alt="" width="16" height="16">
    <span class="titlebar-title"></span>
    <span class="titlebar-version"></span>
  </div>
  <header>
    <div class="title-row">
      <h1>이터널 리턴 아이템별 가격대비 효율 계산기</h1>
      <button id="data-meta" class="meta-line" type="button" title="패치노트 반영 내역 보기" hidden></button>
    </div>
    <div class="update-box">
      <span id="update-status" class="muted" role="status"></span>
      <button id="update-btn" type="button" hidden>아이템 수치 업데이트</button>
    </div>
  </header>

  <div id="data-banner" class="banner" role="alert" hidden></div>

  <main class="layout">
    <section class="panel calc-panel">
      <div class="block slot-pair">
        <div class="slot-col">
          <div class="block-head">
            <h2>장비 슬롯</h2>
            <span id="slot-status" class="muted"></span>
            <span class="spacer"></span>
            <button id="slots-clear" class="text-btn" type="button" aria-label="장비 슬롯 전체 비우기" disabled>전체 비우기</button>
          </div>
          <div id="slots" class="slots"></div>
        </div>
        <div class="slot-col">
          <div class="block-head">
            <h2 title="효율 % = 현재 세트 가격당 데미지 ÷ 기준 세트 가격당 데미지 × 100. 기준 대비 = (현재 데미지 ÷ 기준 데미지 − 1) × 100, 1,000당 = 기준 대비 ÷ 현재 가격 합 × 1000. 5칸을 모두 채우기 전에는 둘 다 —(기준 없음).">데미지 효율 계산 기준</h2>
            <span id="baseline-status" class="muted"></span>
            <span class="spacer"></span>
            <button id="baseline-clear" class="text-btn" type="button" aria-label="기준 세트 전체 비우기" disabled>전체 비우기</button>
          </div>
          <div id="baseline-slots" class="slots"></div>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h2>입력값</h2></div>
        <form id="inputs" class="inputs" onsubmit="return false"></form>
      </div>

      <div class="block calc-row">
        <button id="calc-btn" class="primary" type="button" disabled>계산</button>
        <span id="calc-msg" class="muted error" role="alert"></span>
      </div>
      <div id="result" class="result" aria-live="polite" hidden></div>
    </section>

    <section class="panel history-panel">
      <div class="history-head">
        <h2 title="기록을 클릭하면 그 아이템 구성과 입력값을 다시 불러옵니다. 효율 %·기준 대비는 계산 당시 기준 세트 대비입니다(기준 세트가 비어 있었으면 —). 최고 효율순은 효율 % → 1,000당 순으로 묶어 정렬합니다." aria-describedby="history-help">히스토리</h2>
        <div id="history-tabs" class="tabs" role="group" aria-label="히스토리 정렬">
          <button type="button" data-sort="recent" aria-pressed="true">최근순</button>
          <button type="button" data-sort="efficiency" aria-pressed="false">최고 효율순</button>
        </div>
        <span class="spacer"></span>
        <button id="clear-history" class="text-btn" type="button">전체 삭제</button>
      </div>
      <p id="history-help" class="sr-only">기록을 클릭하면 그 아이템 구성과 입력값을 다시 불러옵니다. 효율 %·기준 대비는 계산 당시 기준 세트 대비입니다(기준 세트가 비어 있었으면 —). 최고 효율순은 효율 % → 1,000당 순으로 묶어 정렬합니다.</p>
      <ol id="history" class="history"></ol>
    </section>
  </main>

  <dialog id="picker" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 id="picker-title"></h2>
      <button id="picker-close" class="text-btn" type="button">닫기</button>
    </div>
    <div class="picker-filters">
      <input id="picker-search" type="search" placeholder="이름 검색" aria-label="아이템 이름 검색" role="combobox" aria-controls="picker-list" aria-expanded="true" aria-autocomplete="list">
      <select id="picker-grade" aria-label="등급"></select>
    </div>
    <ul id="picker-list" class="picker-list" role="listbox" aria-label="아이템 목록"></ul>
  </dialog>

  <dialog id="meta-panel" aria-labelledby="meta-title">
    <div class="picker-head">
      <h2 id="meta-title">패치노트 반영 내역</h2>
      <button id="meta-close" class="text-btn" type="button">닫기</button>
    </div>
    <p id="meta-patch" class="muted"></p>
    <h3>덮어쓴 수치</h3>
    <ul id="meta-overrides" class="meta-list"></ul>
    <h3>확인 필요</h3>
    <ul id="meta-unparsed" class="meta-list"></ul>
  </dialog>

  <script src="src/formula.js"></script>
  <script src="src/formula_v2.js"></script>
  <script src="src/characters.js"></script>
  <script src="src/skills.js"></script>
  <script src="src/history.js"></script>
  <script src="src/baseline.js"></script>
  <script src="src/explain.js"></script>
  <script src="src/updater.js"></script>
  <script src="src/meta.js"></script>
  <script src="src/gauge.js"></script>
  <script src="src/dropdown.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
