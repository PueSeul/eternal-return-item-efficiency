<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이터널 리턴 데미지 효율 계산기</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>이터널 리턴 아이템 가격 대비 데미지 효율 계산기</h1>
    <div class="update-box">
      <span id="update-status" class="muted" role="status"></span>
      <button id="update-btn" type="button" hidden>아이템 수치 업데이트</button>
    </div>
  </header>

  <div id="data-banner" class="banner" hidden></div>

  <main>
    <section class="panel">
      <h2>장비 슬롯</h2>
      <div id="slots" class="slots"></div>
      <p id="slot-status" class="muted"></p>

      <h2>입력값</h2>
      <form id="inputs" class="inputs" onsubmit="return false"></form>

      <button id="calc-btn" class="primary" type="button" disabled>계산</button>
      <div id="result" class="result" hidden></div>
    </section>

    <section class="panel">
      <div class="history-head">
        <h2>히스토리</h2>
        <button id="clear-history" type="button">전체 삭제</button>
      </div>
      <div id="history-tabs" class="tabs" role="group" aria-label="히스토리 정렬">
        <button type="button" data-sort="recent" aria-pressed="true">최근순</button>
        <button type="button" data-sort="efficiency" aria-pressed="false">최고 효율순</button>
      </div>
      <p class="muted">기록을 클릭하면 그 아이템 구성과 입력값을 다시 불러옵니다. 효율 %는 현재 기록 중 최고치 대비입니다.</p>
      <ol id="history" class="history"></ol>
    </section>
  </main>

  <dialog id="picker">
    <div class="picker-head">
      <h2 id="picker-title"></h2>
      <button id="picker-close" type="button">닫기</button>
    </div>
    <div class="picker-filters">
      <input id="picker-search" type="search" placeholder="이름 검색">
      <select id="picker-grade"></select>
    </div>
    <ul id="picker-list" class="picker-list"></ul>
  </dialog>

  <script src="src/formula.js"></script>
  <script src="src/history.js"></script>
  <script src="src/explain.js"></script>
  <script src="src/updater.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
